spring.application.name=UrbanLens
spring.profiles.active=local
server.port=8080

# MySQL (default profile)
spring.datasource.url=jdbc:mysql://localhost:3306/urbanlens?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT placeholders (wired in Phase 2)
urbanlens.jwt.secret=UrbanLensDevSecretChangeMeToAtLeast256BitsLongForHS256!!
urbanlens.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
