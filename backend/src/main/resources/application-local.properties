# Local profile — in-memory H2 so Phase 1 runs without MySQL
spring.datasource.url=jdbc:h2:mem:urbanlens;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Optional Gemini key for live AI (leave blank for mock/demo responses)
# urbanlens.gemini.api-key=
