# Production / cloud profile — reads env vars from Render / Railway
server.port=${PORT:8080}

# Use free H2 for simplest free deploy (data resets when service sleeps/restarts).
# For persistent data later, switch to a free Postgres addon and set DATABASE_URL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:urbanlens;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# MUST override in cloud dashboard (long random string, 32+ chars)
urbanlens.jwt.secret=${JWT_SECRET:UrbanLensProdChangeThisSecretToSomethingLongAndRandom123!}
urbanlens.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional
urbanlens.gemini.api-key=${GEMINI_API_KEY:}
